name: Code checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked package and test dependencies
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked --extra dev
      - name: Lint
        run: uv run --locked ruff check src tests
      - name: Type check
        run: uv run --locked mypy src tests
      - name: Tests with synthetic CSV fixtures only
        run: uv run --locked pytest -q
